name: Build APK (No Android in Repo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter clean
      - run: flutter pub get

      # 🔥 هذا هو المهم: إنشاء Android تلقائياً داخل GitHub
      - run: flutter create --platforms=android .

      # 🔥 إصلاح compileSdk تلقائي
      - run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle || true

      - run: flutter build apk --release

      # 📦 إخراج APK
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
